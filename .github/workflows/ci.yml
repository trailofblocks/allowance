name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: npm ci
      - run: forge build
      # Unit, fuzz (1,000 runs each), and invariant tests (256 runs x 64 calls).
      - run: forge test
      - run: npm run typecheck
      - run: npm run build
      # SDK, x402 end to end (including the official @x402/evm facilitator), MCP, and the lab's asserted numbers.
      - run: npm test
      - name: Red-team lab with ablation (exits non-zero if any attack gets past allowance)
        run: node dist/cli.js lab --ablation
      - name: Mutation check (the invariant suite must catch eight planted bugs)
        if: runner.os == 'Linux'
        run: node scripts/mutation-check.mjs
