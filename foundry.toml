[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]

[lint]
# `forge lint` still works on demand; builds stay quiet.
lint_on_build = false

[fuzz]
runs = 1000
seed = "0x7579"

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# CI uses the same settings; a deeper local run: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 20000

[profile.deep.invariant]
runs = 2000
depth = 128
